<!DOCTYPE html><html lang="fr"><head><script src="assets/js/demo-guard.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a2b"><title>PharmaGest</title><style>:root{--n:#071a2b;--b:#087ea4;--c:#18b7b1;--w:#fff;--s:#f4fbfc;--m:#60727d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;font-family:Arial,sans-serif;background:linear-gradient(135deg,var(--n),#0b344d);color:#15232d}.card{width:100%;max-width:560px;background:#fff;border-radius:24px;padding:26px 22px;box-shadow:0 24px 70px #0005;text-align:center}.brand{font-size:34px;font-weight:900;color:var(--n)}.brand span{color:var(--c)}.tagline{margin:8px auto;color:var(--m);font-size:14px}.welcome{font-size:24px;color:var(--n);margin:22px 0 8px}.message{color:#4d606b;line-height:1.55}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.role{border:1px solid #dcecef;background:var(--s);border-radius:16px;padding:16px;cursor:pointer;text-align:left}.role:hover{border-color:var(--c)}.role b{display:block;color:var(--n);font-size:16px;margin-bottom:6px}.role span{font-size:12px;color:#71808b;line-height:1.4}.icon{font-size:25px;margin-bottom:8px}.footer{margin-top:16px;color:#8797a0;font-size:11px}@media(max-width:480px){.roles{grid-template-columns:1fr}.card{padding:24px 18px}.brand{font-size:30px}}</style><link rel="stylesheet" href="assets/css/theme.css">

</head><body><main class="card"><div class="brand">Pharma<span>Gest</span></div><div class="tagline">Gestion professionnelle des pharmacies</div><h1 class="welcome">Bienvenue dans PharmaGest</h1><p class="message">Une solution simple pour piloter votre activité, avec une base locale et un réseau maître-vendeurs conçu pour fonctionner sans Internet.</p><div class="roles"><button class="role" onclick="choose('admin')"><div class="icon">🏥</div><b>Téléphone maître</b><span>Base centrale, administration, stock, ventes et gestion des vendeurs.</span></button><button class="role" onclick="choose('seller')"><div class="icon">📱</div><b>Téléphone vendeur</b><span>Recherche automatique du maître et accès aux fonctions de vente.</span></button></div><div class="footer">PharmaGest · Installation vierge · 2026</div></main><script>function choose(r){try{window.PharmaGestNative.setRoleFromWeb(r)}catch(e){location.href='login.html'}} </script></body></html>
